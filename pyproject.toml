[project]
name = "fiscozen-mcp"
version = "0.1.0"
description = "Unofficial MCP server and client for Fiscozen invoicing (Italian Partita IVA)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrea Cervesato" }]
keywords = ["mcp", "fiscozen", "invoicing", "fattura-elettronica", "partita-iva"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "mcp>=2.3,<3",
]

[project.urls]
Repository = "https://github.com/thekoma/fiscozen-mcp"

[project.scripts]
fiscozen-mcp = "fiscozen.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "respx>=0.22",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fiscozen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: hits the real Fiscozen account (opt-in: FISCOZEN_LIVE=1)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S603", "S607"]  # we call the macOS `security` CLI on purpose

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
